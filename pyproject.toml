[project]
name = "finlib"
version = "0.1.0"
description = "A library for financial data analysis"
authors = [
    {name = "simone",email = "284838112+bellinquente-a11y@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "aiohttp (>=3.14.1,<4.0.0)"
]

[tool.poetry]
packages = [{include = "finlib", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.1.0,<3.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "black (>=26.3.1,<27.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)"
]
test = [
    "requests (>=2.34.2,<3.0.0)"
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

# Common errors:
# Function is missing a return type annotation
#   -> add -> None, -> str, -> float etc.
# Argument has incompatible type
#   -> your annotations don't match usage