[project]
name = "finlib"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)"
]

[tool.poetry]
packages = [{include = "finlib", from = "src"}]

