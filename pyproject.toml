[project]
name = "finlib"
version = "0.7.2"
description = "A library for financial data analysis"
authors = [
    {name = "simone",email = "284838112+bellinquente-a11y@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "aiohttp (>=3.14.1,<4.0.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "numpy (>=2.5.0,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "structlog (>=26.1.0,<27.0.0)",
    "python-dateutil (>=2.9.0.post0,<3.0.0)",
    "types-python-dateutil (>=2.9.0.20260518,<3.0.0.0)",
    "hypothesis (>=6.156.6,<7.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.1,<0.53.0)"
]

[tool.poetry]
packages = [{include = "finlib", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.1.0,<3.0.0)",
    "ruff (>=0.15.12,<0.16.0)",
    "black (>=26.3.1,<27.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "pandas-stubs (>=3.0.3.260530,<4.0.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.poetry.scripts]
finlib-pipeline = "finlib.pipeline.cli:main"

[tool.ruff]
line-length = 100
target-version = 'py312'

[tool.ruff.lint]
select = [
  'E', 'F',   # pycodestyle, pyflakes (defaults)
  'I',        # isort — import ordering
  'B',        # bugbear — likely-bug patterns
  'UP',       # pyupgrade — modern syntax
  'SIM',      # simplify
  'RET',      # return-statement hygiene
]
