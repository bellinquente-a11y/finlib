name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - run: pip install "poetry>=2.0"
      - run: poetry install --with dev
      - run: poetry run ruff check src/ tests/ script/
      - run: poetry run mypy src/ tests/ script/ --strict
      - run: poetry run pytest --cov=finlib --cov-fail-under=90 -v
